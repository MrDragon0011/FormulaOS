<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FormulaOS</title>
<meta name="description" content="FormulaOS — a web-based operating system" />
<meta name="theme-color" content="#e10600" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Boot Screen -->
<div id="boot-screen">
  <div class="boot-logo" id="boot-logo-icon"></div>
  <div class="boot-title">FormulaOS</div>
  <div class="boot-bar"><div class="boot-bar-fill"></div></div>
  <div class="boot-status">Starting up…</div>
</div>

<!-- Lock Screen -->
<div id="lock-screen" class="hidden">
  <div class="lock-clock">
    <div id="lock-time">00:00</div>
    <div id="lock-date">Day, Month 0</div>
  </div>
  <div class="lock-user">
    <div class="lock-avatar" id="lock-avatar-icon"></div>
    <div class="lock-username" id="lock-username">Driver</div>
  </div>
  <div class="lock-hint">Click anywhere or press any key to unlock</div>
</div>

<!-- Menu Bar (top, macOS-style) -->
<div id="menubar">
  <div class="mb-left">
    <div class="mb-item mb-logo" id="mb-logo-btn"></div>
    <div class="mb-item mb-appname" id="mb-appname">Finder</div>
    <div class="mb-item mb-menu" data-menu="file">File</div>
    <div class="mb-item mb-menu" data-menu="edit">Edit</div>
    <div class="mb-item mb-menu" data-menu="view">View</div>
    <div class="mb-item mb-menu" data-menu="window">Window</div>
    <div class="mb-item mb-menu" data-menu="help">Help</div>
  </div>
  <div class="mb-right">
    <div class="mb-item mb-icon" id="mb-search"></div>
    <div class="mb-item mb-icon" id="mb-wifi"></div>
    <div class="mb-item mb-icon" id="mb-battery"></div>
    <div class="mb-item mb-icon" id="mb-control"></div>
    <div class="mb-item mb-clock" id="mb-clock">
      <span id="clock-date">--</span>&nbsp;<span id="clock-time">00:00</span>
    </div>
  </div>
</div>
<div id="mb-dropdown" class="hidden"></div>

<!-- Desktop -->
<div id="desktop">
  <div id="icons"></div>
  <div id="windows"></div>
  <div id="snap-preview" class="hidden"></div>
</div>
<div id="context-menu" class="hidden"></div>

<!-- Spotlight Search -->
<div id="spotlight" class="hidden">
  <div class="spotlight-box">
    <span class="spotlight-icon" id="spotlight-icon"></span>
    <input id="spotlight-input" placeholder="Spotlight Search" autocomplete="off" />
  </div>
  <div id="spotlight-results"></div>
</div>

<!-- Launchpad -->
<div id="launchpad" class="hidden">
  <input id="launchpad-search" placeholder="Search" autocomplete="off" />
  <div id="launchpad-grid"></div>
</div>

<!-- Dock (bottom, macOS-style) -->
<div id="dock-wrap">
  <div id="dock"></div>
</div>

<!-- Control Center popover -->
<div id="control-center" class="hidden"></div>

<script src="js/icons.js"></script>
<script src="js/wallpaper.js"></script>
<script src="js/fs.js"></script>
<script src="js/windows.js"></script>
<script src="js/apps.js"></script>
<script src="js/apps2.js"></script>
<script src="js/os.js"></script>
</body>
</html>
