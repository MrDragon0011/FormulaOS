<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DragonOS</title>
<meta name="description" content="DragonOS — a web-based operating system" />
<meta name="theme-color" content="#ff5f45" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Boot Screen -->
<div id="boot-screen">
  <div class="boot-logo">🐉</div>
  <div class="boot-title">DragonOS</div>
  <div class="boot-bar"><div class="boot-bar-fill"></div></div>
  <div class="boot-status">Starting up…</div>
</div>

<!-- Lock Screen -->
<div id="lock-screen" class="hidden">
  <div class="lock-clock">
    <div id="lock-time">00:00</div>
    <div id="lock-date">Day, Month 0</div>
  </div>
  <div class="lock-hint">Click anywhere or press any key to unlock</div>
</div>

<!-- Desktop -->
<div id="desktop">
  <div id="icons"></div>
  <div id="windows"></div>
  <div id="context-menu" class="hidden"></div>
</div>

<!-- Taskbar -->
<div id="taskbar">
  <button id="start-btn"><span class="dragon-emoji">🐉</span> DragonOS</button>
  <div id="start-menu" class="hidden"></div>
  <div id="taskbar-apps"></div>
  <div id="tray">
    <span id="tray-icons"></span>
    <div id="clock">
      <div id="clock-time">00:00</div>
      <div id="clock-date">--/--/----</div>
    </div>
  </div>
</div>

<script src="js/fs.js"></script>
<script src="js/windows.js"></script>
<script src="js/apps.js"></script>
<script src="js/apps2.js"></script>
<script src="js/os.js"></script>
</body>
</html>
